name: Deploy results explorer to GitHub Pages

# Builds the static export in viz/ and publishes it to GitHub Pages.
#
# Requires one manual setting, once: repository Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Without that the deploy step fails
# with a permissions error that does not explain itself.
#
# The site is published at https://<owner>.github.io/<repo>/, which is a project
# page, so every asset URL needs the repository name as a base path. That is what
# BASEPATH does below; leaving it unset is correct for local development only.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes. Commits that
    # touch flcore/, attacks/ or run.py alone do not need a redeploy.
    paths:
      - 'viz/**'
      - 'results/**'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one that is mid-flight —
# a half-finished Pages deploy leaves the site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viz/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The results bundle is generated here, never committed. results/ is the
      # source of truth and is in the repository; the bundle is derived from it
      # and is gitignored, so there is nothing to keep in sync by hand.
      - name: Generate results bundle
        run: pnpm run build:data

      # Record which dataset was deployed. build-data.mjs hashes the results
      # payload, so this identifies the exact figures on the published site.
      - name: Report dataset identity
        run: |
          node -e '
            const b = require("./src/data/generated/results.json");
            const lines = [
              "### Results explorer deployment",
              "",
              "| | |",
              "|---|---|",
              `| Runs | ${b.runCount} |`,
              `| Dataset hash | \`${b.dataHash}\` |`,
              `| Excluded directories | ${b.excluded.length} |`,
              `| Integrity warnings | ${b.integrityWarnings.length} |`
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (b.integrityWarnings.length) {
              for (const w of b.integrityWarnings) console.log(`::warning::${w}`);
            }
          '

      # These gate the deployment. All three run without network and catch the
      # classes of error that are easy to miss locally.
      - name: Unit tests
        run: pnpm run test

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build static export
        env:
          BASEPATH: /${{ github.event.repository.name }}
        run: pnpm exec next build

      - name: Disable Jekyll
        # GitHub Pages runs Jekyll by default, and Jekyll ignores directories
        # whose names begin with an underscore — which includes Next.js's
        # _next/ directory, i.e. every script and stylesheet. Without this file
        # the site deploys as unstyled HTML with no obvious cause.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
