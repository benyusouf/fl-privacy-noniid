name: Deploy results explorer to GitHub Pages

# Builds the static export in viz/ and publishes it to GitHub Pages.
#
# Requires one manual setting, once: repository Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Without that the deploy step fails
# with a permissions error that does not explain itself.
#
# The site is published at https://<owner>.github.io/<repo>/, which is a project
# page, so every asset URL needs the repository name as a base path. That is what
# BASEPATH does below; leaving it unset is correct for local development only.

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes. Commits that
    # touch flcore/, attacks/ or run.py alone do not need a redeploy.
    paths:
      - 'viz/**'
      - 'results/**'
      - '.github/workflows/deploy-viz.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and never cancel one that is mid-flight —
# a half-finished Pages deploy leaves the site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viz

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viz/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Regenerate the results bundle from results/ rather than trusting the
      # committed copy. If the two ever disagree, the run should fail here.
      - name: Build data bundle
        run: pnpm run build:data

      # This works because the bundle is deterministic: build-data.mjs writes a
      # content hash of the results rather than a build timestamp, so rebuilding
      # identical inputs produces a byte-identical file. If that ever changes,
      # this step starts failing on every push.
      - name: Fail if the committed data bundle is stale
        run: |
          if ! git ls-files --error-unmatch src/data/generated/results.json >/dev/null 2>&1; then
            echo "::error::src/data/generated/results.json is not tracked by git."
            echo "Commit it so this check can compare the committed copy against a fresh build."
            exit 1
          fi
          if ! git diff --quiet -- src/data/generated/results.json; then
            echo "::error::src/data/generated/results.json is out of date with results/."
            echo "Run 'node scripts/build-data.mjs' in viz/ and commit the result."
            git diff --stat -- src/data/generated/results.json
            exit 1
          fi

      # These gate the deployment. Both run without network and both catch the
      # classes of error that are easy to miss locally.
      - name: Unit tests
        run: pnpm run test

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build static export
        env:
          BASEPATH: /${{ github.event.repository.name }}
        run: pnpm exec next build

      - name: Disable Jekyll
        # GitHub Pages runs Jekyll by default, and Jekyll ignores directories
        # whose names begin with an underscore — which includes Next.js's
        # _next/ directory, i.e. every script and stylesheet. Without this file
        # the site deploys as unstyled HTML with no obvious cause.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viz/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
